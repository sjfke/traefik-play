#######################################################################
##
## /etc/lighttpd/lighttpd.conf is the entry point for lighttpd configuration.
## This file may include others using 'include' or 'include_shell'.
##
## Print configuration: lighttpd -f /etc/lighttpd/lighttpd.conf -p
## Check configuration: lighttpd -f /etc/lighttpd/lighttpd.conf -tt
##
## References
## Wiki: https://wiki.lighttpd.net/
## Configuration: Quick Start: https://wiki.lighttpd.net/TutorialConfiguration
## Configuration: File Syntax: https://wiki.lighttpd.net/Docs_Configuration
## Configuration: Options: https://wiki.lighttpd.net/Docs_ConfigurationOptions
##

var.basedir  = "/var/www/localhost"
var.logdir   = "/var/log/lighttpd"
var.statedir = "/var/lib/lighttpd"

# At the very least, mod_access and mod_accesslog should be enabled.
# All other modules should only be loaded if necessary.
# NOTE: the order of modules is important
server.modules = (
#    "mod_rewrite",
#    "mod_redirect",
#    "mod_alias",
    "mod_access",
#    "mod_cml",
#    "mod_trigger_b4_dl",
#    "mod_auth",
#    "mod_status",
#    "mod_setenv",
#    "mod_proxy",
#    "mod_simple_vhost",
#    "mod_evhost",
#    "mod_userdir",
#    "mod_deflate",
#    "mod_ssi",
#    "mod_usertrack",
#    "mod_expire",
#    "mod_secdownload",
#    "mod_rrdtool",
#    "mod_webdav",
    "mod_accesslog"
)

include "mime-types.conf"
# include "mod_cgi.conf"         # uncomment for cgi support
# include "mod_fastcgi.conf"     # uncomment for cgi support
# include "mod_fastcgi_fpm.conf" # uncomment for cgi support

server.username      = "lighttpd"
server.groupname     = "lighttpd"

server.document-root = var.basedir + "/htdocs"
server.pid-file      = "/run/lighttpd.pid"

server.errorlog      = var.logdir  + "/error.log"
# server.errorlog-use-syslog = "enable" # log errors to syslog instead

# server.tag           = "lighttpd"
server.indexfiles    = ("index.php", "index.html", "index.htm", "default.htm")
server.follow-symlink = "enable"

# event handler (defaults to "poll")
# see performance.txt
#
# for >= linux-2.4
#   server.event-handler = "linux-rtsig"
# for >= linux-2.6
#   server.event-handler = "linux-sysepoll"
# for FreeBSD
#   server.event-handler = "freebsd-kqueue"

# chroot to directory (defaults to no chroot)
# server.chroot      = "/"

# bind to port (defaults to 80)
# server.port          = 81

# bind to name (defaults to all interfaces)
# server.bind          = "grisu.home.kneschke.de"

# error-handler for status 404
# server.error-handler-404 = "/error-handler.html"
# server.error-handler-404 = "/error-handler.php"

# Format: <errorfile-prefix><status-code>.html
# -> ..../status-404.html for 'File not found'
# server.errorfile-prefix    = var.basedir + "/error/status-"

# FAM support for caching stat() calls
# requires that lighttpd be built with USE=fam
#   server.stat-cache-engine = "fam"

# which extensions should not be handled via static-file transfer
# (extensions that are usually handled by mod_cgi, mod_fastcgi, etc).
static-file.exclude-extensions = (".php", ".pl", ".cgi", ".fcgi")

## mod_accesslog
accesslog.filename   = var.logdir + "/access.log"

## mod_dirlisting
# enable directory listings
#   dir-listing.activate      = "enable"
#
# don't list hidden files/directories
#   dir-listing.hide-dotfiles = "enable"
#
# use a different css for directory listings
#   dir-listing.external-css  = "/path/to/dir-listing.css"
#
# list of regular expressions.  files that match any of the
# specified regular expressions will be excluded from directory
# listings.
#   dir-listing.exclude = ("^\.", "~$")

## mod_access
# see conf.d/auth.conf
url.access-deny = ("~", ".inc")


## mod_userdir
# see conf.d/userdir.conf
# userdir.path = "public_html"
# userdir.exclude-user = ("root")

## mod_ssi
# see conf.d/ssi.conf
# ssi.extension = (".shtml")

## mod_ssl
# see conf.d/tls.conf
# ssl.engine    = "enable"
# ssl.pemfile   = "server.pem"

## mod_status
# see conf.d/status.conf
# status.status-url  = "/server-status"
# status.config-url  = "/server-config"

## mod_simple_vhost
# see conf.d/simple-vhost.conf
#  name-based virtual hosting add the next three settings and load  mod_simple_vhost
# document-root =
#   virtual-server-root + virtual-server-default-host + virtual-server-docroot
# or
#   virtual-server-root + http-host + virtual-server-docroot
